<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>ProotCode brand guide</title><rect width="1600" height="1000" fill="#FAFAFA"/><text x="80" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#111114">ProotCode</text><text x="80" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#55555c">Brand guide · app icon, concept and palette</text><g transform="translate(80,200) scale(0.34)"><rect width="1024" height="1024" rx="230" fill="#F52D49"/><defs><clipPath id="tg1"><rect x="0" y="0" width="1024" height="490"/></clipPath><clipPath id="bg1"><rect x="0" y="534" width="1024" height="490"/></clipPath></defs><g transform="translate(30,0)"><g clip-path="url(#tg1)"><polygon points="237,824 387,824 787,200 637,200" fill="#FFFFFF"/></g></g><g transform="translate(-30,0)"><g clip-path="url(#bg1)"><polygon points="237,824 387,824 787,200 637,200" fill="#FFFFFF"/></g></g></g><g transform="translate(460,200) scale(0.34)"><rect width="1024" height="1024" rx="230" fill="#111114"/><defs><clipPath id="tg2"><rect x="0" y="0" width="1024" height="490"/></clipPath><clipPath id="bg2"><rect x="0" y="534" width="1024" height="490"/></clipPath></defs><g transform="translate(30,0)"><g clip-path="url(#tg2)"><polygon points="237,824 387,824 787,200 637,200" fill="#F52D49"/></g></g><g transform="translate(-30,0)"><g clip-path="url(#bg2)"><polygon points="237,824 387,824 787,200 637,200" fill="#F52D49"/></g></g></g><g transform="translate(840,200) scale(0.34)"><rect width="1024" height="1024" rx="230" fill="#FFFFFF"/><defs><clipPath id="tg3"><rect x="0" y="0" width="1024" height="490"/></clipPath><clipPath id="bg3"><rect x="0" y="534" width="1024" height="490"/></clipPath></defs><g transform="translate(30,0)"><g clip-path="url(#tg3)"><polygon points="237,824 387,824 787,200 637,200" fill="#F52D49"/></g></g><g transform="translate(-30,0)"><g clip-path="url(#bg3)"><polygon points="237,824 387,824 787,200 637,200" fill="#F52D49"/></g></g><rect x="1.5" y="1.5" width="1021" height="1021" rx="229" fill="none" stroke="#E4E4E7" stroke-width="3"/></g><text x="1240" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111114">Concept</text><text x="1240" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#55555c">The slash is the command line:</text><text x="1240" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#55555c">the path separator, the prompt,</text><text x="1240" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#55555c">the root of a Linux filesystem.</text><text x="1240" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#55555c">Split in two, it shows a Linux</text><text x="1240" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#55555c">environment (proot) running</text><text x="1240" y="422" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#55555c">inside Android, one layer cut</text><text x="1240" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#55555c">through another.</text><text x="80" y="610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111114">Palette</text><rect x="80" y="640" width="320" height="150" rx="20" fill="#F52D49" /><text x="80" y="826" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#111114">Signal Red</text><text x="80" y="858" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#55555c">#F52D49  ·  245 45 73</text><text x="80" y="888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#8a8a92">Icon background, accent</text><rect x="440" y="640" width="320" height="150" rx="20" fill="#111114" /><text x="440" y="826" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#111114">Ink</text><text x="440" y="858" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#55555c">#111114  ·  17 17 20</text><text x="440" y="888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#8a8a92">Dark background, wordmark</text><rect x="800" y="640" width="320" height="150" rx="20" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="2"/><text x="800" y="826" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#111114">White</text><text x="800" y="858" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#55555c">#FFFFFF  ·  255 255 255</text><text x="800" y="888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#8a8a92">Glyph on red, light surfaces</text><text x="1200" y="610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111114">Construction</text><text x="1200" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#55555c">Grid: 1024 × 1024</text><text x="1200" y="682" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#55555c">Corner radius: 230 (22.5%)</text><text x="1200" y="714" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#55555c">Slash width: 150, slant 450 / 624</text><text x="1200" y="746" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#55555c">Cut gap: 44, offset: ±30</text><text x="1200" y="778" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#55555c">Favicon: gap 90, offset ±38</text><text x="1200" y="810" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#55555c">Clear space: ≥ 1/8 of icon width</text><text x="1200" y="842" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#55555c">Min size: 16 px (use favicon.svg)</text><text x="80" y="940" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#8a8a92">Files: prootcode-split-red.svg · prootcode-split-black.svg · favicon.svg</text><g transform="translate(1400,880)"><g transform="scale(0.0625)"><rect width="1024" height="1024" rx="230" fill="#F52D49"/><defs><clipPath id="tg4"><rect x="0" y="0" width="1024" height="490"/></clipPath><clipPath id="bg4"><rect x="0" y="534" width="1024" height="490"/></clipPath></defs><g transform="translate(30,0)"><g clip-path="url(#tg4)"><polygon points="237,824 387,824 787,200 637,200" fill="#FFFFFF"/></g></g><g transform="translate(-30,0)"><g clip-path="url(#bg4)"><polygon points="237,824 387,824 787,200 637,200" fill="#FFFFFF"/></g></g></g></g><g transform="translate(1490,896)"><g transform="scale(0.03125)"><rect width="1024" height="1024" rx="230" fill="#F52D49"/><defs><clipPath id="tg5"><rect x="0" y="0" width="1024" height="490"/></clipPath><clipPath id="bg5"><rect x="0" y="534" width="1024" height="490"/></clipPath></defs><g transform="translate(30,0)"><g clip-path="url(#tg5)"><polygon points="237,824 387,824 787,200 637,200" fill="#FFFFFF"/></g></g><g transform="translate(-30,0)"><g clip-path="url(#bg5)"><polygon points="237,824 387,824 787,200 637,200" fill="#FFFFFF"/></g></g></g></g></svg>