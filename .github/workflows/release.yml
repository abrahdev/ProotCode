name: Release

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: |
            platforms;android-37.0
            build-tools;37.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Formatting, lint, and tests
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest --stacktrace

  build:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: |
            platforms;android-37.0
            build-tools;37.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/prootcode-release.jks"
          cat > key.properties <<EOF
          storeFile=$RUNNER_TEMP/prootcode-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(cat VERSION)
          cp app/build/outputs/apk/release/app-release.apk "prootcode-${VERSION}.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: prootcode-*.apk

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/prootcode-release.jks" key.properties

  release:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat VERSION)
          if [[ "$VERSION" == *-* ]]; then
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes --prerelease "prootcode-${VERSION}.apk"
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes "prootcode-${VERSION}.apk"
          fi
