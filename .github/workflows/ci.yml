name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mobile

      - name: Formatting, lint, tests, and debug build
        working-directory: mobile
        run: ./gradlew ktlintCheck lintStandardDebug testStandardDebugUnitTest assembleStandardDebug --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            mobile/app/build/reports/**
            mobile/build/reports/**
          if-no-files-found: ignore
